---
base_deploy_user: deploy
base_deploy_pubkey_file: ~/.ssh/assay_netcup.pub
base_timezone: Europe/Paris
base_swapfile: /swapfile
base_swap_size_mb: 2048
base_swappiness: 10
base_journal_max_use: 500M

# fail2ban on sshd: this many failures within findtime ban the address for bantime.
base_fail2ban_maxretry: 5
base_fail2ban_findtime: 10m
base_fail2ban_bantime: 1h

# Unattended security (and point-release) upgrades. A kernel or libc update needs a reboot to take effect; the stack
# comes back by itself (Docker restarts every container: restart unless-stopped), after about 3 minutes.
base_auto_reboot: true
base_auto_reboot_time: "04:30"
