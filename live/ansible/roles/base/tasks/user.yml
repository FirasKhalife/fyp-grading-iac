---
# The deploy user: SSH key only (no password at all), passwordless sudo for Ansible. Used by bootstrap.yml (as root)
# and by the base role.
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the deploy user, with no password
  ansible.builtin.user:
    name: "{{ base_deploy_user }}"
    shell: /bin/bash
    create_home: true
    password: "!"
    update_password: on_create

- name: Authorise the deploy key, and only it
  ansible.posix.authorized_key:
    user: "{{ base_deploy_user }}"
    key: "{{ lookup('ansible.builtin.file', base_deploy_pubkey_file) }}"
    exclusive: true

- name: Give the deploy user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ base_deploy_user }}
    content: |
      # Managed by Ansible (fyp-grading-iac/live). The account has no password; it signs in with its SSH key only.
      {{ base_deploy_user }} ALL=(ALL:ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
