# Read through ANSIBLE_CONFIG (../deploy.sh and ../check.sh set it): from WSL, a repo on C: is world-writable, and
# Ansible ignores an ansible.cfg it finds in a world-writable working directory.
[defaults]
inventory = inventory.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
nocows = True

[ssh_connection]
pipelining = True
# accept-new: trust the server's host key on the first connection, refuse a changed one afterwards. After a reinstall,
# remove the old key with: ssh-keygen -R <server-ip>
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
